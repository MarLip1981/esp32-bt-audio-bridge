name: Vendor ESP32-A2DP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-a2dp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor ESP32-A2DP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf components/ESP32-A2DP
          git clone --depth 1 https://github.com/pschatzmann/ESP32-A2DP.git components/ESP32-A2DP
          rm -rf components/ESP32-A2DP/.git
          rm -rf components/ESP32-A2DP/.github
          rm -rf components/ESP32-A2DP/docs
          rm -rf components/ESP32-A2DP/examples

          cat > components/ESP32-A2DP/CMakeLists.txt <<'EOF'
          idf_component_register(
              SRC_DIRS src
              INCLUDE_DIRS src
              REQUIRES bt esp_common freertos hal log nvs_flash driver
          )

          target_compile_options(${COMPONENT_LIB} PUBLIC
              -DA2DP_LEGACY_I2S_SUPPORT=0
              -DA2DP_I2S_AUDIOTOOLS=0
          )
          EOF

          rm -f components/bt_audio_bridge/idf_component.yml
          rm -f TEST_CODEX_WRITE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ESP32-A2DP components/bt_audio_bridge TEST_CODEX_WRITE.txt

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Vendor ESP32-A2DP for ESPHome native build"
            git push
          fi
