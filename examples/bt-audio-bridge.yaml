# ============================================================================
# BT AUDIO BRIDGE - PRZYKŁADOWA KONFIGURACJA ESPHOME
# ============================================================================
#
# SPRZĘT:
#   ESP32 DevKit V1 / ESP32-WROOM-32 (ESP32 Classic Bluetooth)
#
# CEL PROJEKTU:
#   Home Assistant -> Wi-Fi -> ESP32 -> Bluetooth Classic A2DP Source -> głośnik
#
# AKTUALNY STAN:
#   - Wi-Fi / ESPHome API: OK
#   - Bluetooth Classic + A2DP Source: OK
#   - skanowanie urządzeń: OK
#   - lista urządzeń w HA: OK
#   - połączenie z wybranym głośnikiem: OK
#   - zapamiętanie głośnika: OK
#   - synchronizacja aktualnego głośnika po auto-reconnect: DODANA
#   - testowe audio 440 Hz: DODANE - TERAZ TESTUJEMY
#   - właściwy dźwięk z Home Assistant: NASTĘPNY ETAP
#
# PLAN:
#   1. Skanowanie / wybór / połączenie                         [DZIAŁA]
#   2. Testowe audio przez A2DP                                [TERAZ]
#   3. Media Player / audio z Home Assistant
#   4. Zapamiętanie głośnika + auto-reconnect                  [DZIAŁA]
#   5. Synchronizacja informacji o aktualnym głośniku          [DZIAŁA]
#   6. Rozłączanie / zapominanie urządzenia
#   7. Diagnostyka Bluetooth RSSI + Wi-Fi RSSI + statusy
#   8. TTS
#   9. Docelowy, uporządkowany interfejs HA
#
# UWAGA: przykład jest bez prawdziwych sekretów. Wi-Fi korzysta z !secret.
# ============================================================================

esphome:
  name: bt-audio-bridge
  friendly_name: BT audio bridge

external_components:
  - source: github://MarLip1981/esp32-bt-audio-bridge
    components: [bt_audio_bridge]
    refresh: 1s

bt_audio_bridge:
  id: bt_audio_bridge_id

  status:
    name: "Bluetooth Audio Bridge Status"

  event:
    name: "Bluetooth Audio Bridge Event"

  reset_reason:
    name: "Bluetooth Audio Bridge Reset Reason"

  device:
    name: "Bluetooth Selected Device MAC"

  current_speaker:
    name: "Bluetooth Current Speaker"

  devices:
    - text_sensor:
        name: "Bluetooth Device 1"
    - text_sensor:
        name: "Bluetooth Device 2"
    - text_sensor:
        name: "Bluetooth Device 3"
    - text_sensor:
        name: "Bluetooth Device 4"
    - text_sensor:
        name: "Bluetooth Device 5"
    - text_sensor:
        name: "Bluetooth Device 6"
    - text_sensor:
        name: "Bluetooth Device 7"
    - text_sensor:
        name: "Bluetooth Device 8"

logger:

api:
  encryption:
    key: "REPLACE_WITH_YOUR_32_BYTE_BASE64_API_KEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: BT audio bridge

captive_portal:

button:
  - platform: template
    name: "Skanuj Bluetooth"
    icon: "mdi:bluetooth"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).start_scan();

  - platform: template
    name: "Stop Scan"
    icon: "mdi:bluetooth-off"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).stop_scan();

  - platform: template
    name: "Bluetooth Connect 1"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(0);

  - platform: template
    name: "Bluetooth Connect 2"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(1);

  - platform: template
    name: "Bluetooth Connect 3"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(2);

  - platform: template
    name: "Bluetooth Connect 4"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(3);

  - platform: template
    name: "Bluetooth Connect 5"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(4);

  - platform: template
    name: "Bluetooth Connect 6"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(5);

  - platform: template
    name: "Bluetooth Connect 7"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(6);

  - platform: template
    name: "Bluetooth Connect 8"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(7);

  - platform: template
    name: "Test Audio"
    icon: "mdi:volume-high"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).start_test_tone();

  - platform: template
    name: "Stop Test Audio"
    icon: "mdi:volume-off"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).stop_test_tone();

  - platform: template
    name: "Bluetooth Disconnect"
    icon: "mdi:bluetooth-off"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).disconnect();
