esphome:
  name: bt-audio-bridge
  friendly_name: BT audio bridge

esp32:
  variant: esp32
  framework:
    type: esp-idf

external_components:
  - source: github://MarLip1981/esp32-bt-audio-bridge
    components: [bt_audio_bridge]
    refresh: 1s

logger:
  level: INFO

api:
  encryption:
    key: "REPLACE_WITH_YOUR_32_BYTE_BASE64_API_KEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

bt_audio_bridge:
  id: bt_audio_bridge_id

  # Format przyjmowany przez tor A2DP:
  # PCM 44.1 kHz / 16 bit / stereo.
  bits_per_sample: 16
  num_channels: 2
  sample_rate: 44100

  status:
    name: "Bluetooth Status"
  event:
    name: "Bluetooth Event"
  reset_reason:
    name: "Bluetooth Reset Reason"
  device:
    name: "Bluetooth Selected Device"
  rssi:
    name: "Bluetooth RSSI"
  battery:
    name: "Bluetooth Battery Status"

  devices:
    - text_sensor:
        name: "Bluetooth Device 1"
    - text_sensor:
        name: "Bluetooth Device 2"
    - text_sensor:
        name: "Bluetooth Device 3"

  diagnostics:
    heap_free:
      name: "RAM Free"
    heap_largest_block:
      name: "RAM Largest Block"
    bt_status:
      name: "BT Status"
    bt_connections:
      name: "BT Connections"
    bt_reconnects:
      name: "BT Reconnects"
    cpu_load:
      name: "CPU Load"

# ============================================================================
# HOME ASSISTANT -> ESP32 -> BT
# ============================================================================
# ESPHome's native speaker media_player works on ESP-IDF and forwards
# the decoded PCM directly into bt_audio_bridge.
#
# Home Assistant transcodes the requested media to WAV 44.1 kHz / stereo /
# 16-bit, which keeps the classic ESP32 decoder side as light as possible.
media_player:
  - platform: speaker
    name: "BT Audio Bridge"
    id: bt_media_player

    volume_increment: 0.05
    volume_initial: 0.8
    volume_min: 0.0
    volume_max: 1.0

    # Keep RAM usage under control on ESP32-WROOM-32.
    buffer_size: 8000

    # One pipeline = lower RAM usage. With a single pipeline ESPHome uses
    # it as the default playback path for Home Assistant media.
    announcement_pipeline:
      speaker: bt_audio_bridge_id
      format: WAV
      num_channels: 2
      sample_rate: 44100

# ============================================================================
# BLUETOOTH CONTROL
# ============================================================================

button:
  - platform: template
    name: "Bluetooth Scan"
    on_press:
      - lambda: id(bt_audio_bridge_id).start_scan();

  - platform: template
    name: "Bluetooth Stop Scan"
    on_press:
      - lambda: id(bt_audio_bridge_id).stop_scan();

  - platform: template
    name: "Bluetooth Connect 1"
    on_press:
      - lambda: id(bt_audio_bridge_id).connect_slot(0);

  - platform: template
    name: "Bluetooth Connect 2"
    on_press:
      - lambda: id(bt_audio_bridge_id).connect_slot(1);

  - platform: template
    name: "Bluetooth Connect 3"
    on_press:
      - lambda: id(bt_audio_bridge_id).connect_slot(2);

  - platform: template
    name: "Bluetooth Disconnect"
    on_press:
      - lambda: id(bt_audio_bridge_id).disconnect();

  - platform: template
    name: "Bluetooth Forget"
    on_press:
      - lambda: id(bt_audio_bridge_id).forget_speaker();
