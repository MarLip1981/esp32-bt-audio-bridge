# ============================================================================
# BT AUDIO BRIDGE -> HOME ASSISTANT MEDIA PLAYER
# ============================================================================
# ESP32 DevKit V1 / ESP32-WROOM-32
# Bluetooth Classic A2DP Source -> external Bluetooth speaker
#
# The bt_audio_bridge component is also exposed as an ESPHome Speaker.
# The native ESPHome speaker media_player then makes this device selectable
# as an audio/media_player target in Home Assistant.
#
# Audio path:
# Home Assistant -> ESPHome Media Player -> WAV/PCM pipeline ->
# BtAudioBridge Speaker -> BtAudioEngine -> A2DP -> Bluetooth speaker
#
# Deliberately use WAV and 44.1 kHz / 16 bit / stereo to avoid MP3/FLAC
# decoder RAM usage on the classic ESP32.
# ============================================================================

esphome:
  name: bt-audio-bridge
  friendly_name: BT Audio Bridge

esp32:
  variant: esp32
  framework:
    type: arduino

external_components:
  - source: github://MarLip1981/esp32-bt-audio-bridge
    components: [bt_audio_bridge]
    refresh: 1s

logger:

api:
  encryption:
    key: "REPLACE_WITH_YOUR_32_BYTE_BASE64_API_KEY"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: BT Audio Bridge

captive_portal:

bt_audio_bridge:
  id: bt_audio_bridge_id

  status:
    name: "Bluetooth Status"

  event:
    name: "Bluetooth Event"

  reset_reason:
    name: "Bluetooth Reset Reason"

  device:
    name: "Bluetooth Selected Device"

  rssi:
    name: "Bluetooth RSSI"

  battery:
    name: "Bluetooth Battery Status"

  devices:
    - text_sensor:
        name: "Bluetooth Device 1"
    - text_sensor:
        name: "Bluetooth Device 2"
    - text_sensor:
        name: "Bluetooth Device 3"
    - text_sensor:
        name: "Bluetooth Device 4"
    - text_sensor:
        name: "Bluetooth Device 5"
    - text_sensor:
        name: "Bluetooth Device 6"
    - text_sensor:
        name: "Bluetooth Device 7"
    - text_sensor:
        name: "Bluetooth Device 8"

  diagnostics:
    wifi_rssi:
      name: "WiFi RSSI"
    wifi_signal:
      name: "WiFi Signal"
    wifi_channel:
      name: "WiFi Channel"
    wifi_tx_power:
      name: "WiFi TX Power"
    wifi_ssid:
      name: "WiFi SSID"
    wifi_phy:
      name: "WiFi PHY"
    wifi_status:
      name: "WiFi Status"
    wifi_uptime:
      name: "WiFi Uptime"
    cpu_load:
      name: "CPU Load"
    cpu_frequency:
      name: "CPU Frequency"
    heap_free:
      name: "RAM Free"
    heap_used:
      name: "RAM Used"
    heap_percent:
      name: "RAM Used Percent"
    heap_min_free:
      name: "RAM Minimum Free"
    heap_largest_block:
      name: "RAM Largest Block"
    bt_status:
      name: "BT Status"
    bt_controller:
      name: "BT Controller"
    bt_connections:
      name: "BT Connections"
    bt_reconnects:
      name: "BT Reconnects"
    bt_uptime:
      name: "BT Uptime"

# ============================================================================
# HOME ASSISTANT MEDIA PLAYER
# ============================================================================
# Only announcement_pipeline is configured. The ESPHome speaker media_player
# treats this as a single pipeline, so normal media and announcements use the
# same BT output without allocating a second audio pipeline.

media_player:
  - platform: speaker
    name: "BT Audio Bridge"
    id: bt_media_player
    volume_increment: 0.05
    volume_initial: 0.8
    volume_min: 0.0
    volume_max: 1.0
    buffer_size: 12000
    announcement_pipeline:
      speaker: bt_audio_bridge_id
      format: WAV
      num_channels: 2
      sample_rate: 44100

# ============================================================================
# BLUETOOTH CONTROL
# ============================================================================

button:
  - platform: template
    name: "Bluetooth Scan"
    icon: "mdi:bluetooth-audio"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).start_scan();

  - platform: template
    name: "Bluetooth Stop Scan"
    icon: "mdi:bluetooth-off"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).stop_scan();

  - platform: template
    name: "Bluetooth Connect 1"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(0);

  - platform: template
    name: "Bluetooth Connect 2"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(1);

  - platform: template
    name: "Bluetooth Connect 3"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(2);

  - platform: template
    name: "Bluetooth Connect 4"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(3);

  - platform: template
    name: "Bluetooth Connect 5"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(4);

  - platform: template
    name: "Bluetooth Connect 6"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(5);

  - platform: template
    name: "Bluetooth Connect 7"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(6);

  - platform: template
    name: "Bluetooth Connect 8"
    icon: "mdi:bluetooth-connect"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).connect_slot(7);

  - platform: template
    name: "Bluetooth Disconnect"
    icon: "mdi:bluetooth-off"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).disconnect();

  - platform: template
    name: "Bluetooth Forget"
    icon: "mdi:bluetooth-settings"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).forget_speaker();

  - platform: template
    name: "Test Audio"
    icon: "mdi:volume-high"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).start_test_tone();

  - platform: template
    name: "Stop Test Audio"
    icon: "mdi:volume-off"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).stop_test_tone();

  - platform: template
    name: "Audio Engine Test"
    icon: "mdi:audio-video"
    on_press:
      - lambda: |-
          id(bt_audio_bridge_id).start_engine_test();
